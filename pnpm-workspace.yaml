packages:
  - apps/site

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
# 7 days, in minutes: a younger release reaches neither the lockfile nor an install (GravionLabs/ci#239).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.6'
  - '@angular-devkit/core@22.2.6'
  - '@angular-devkit/schematics@22.2.6'
  - '@angular/build@22.2.6'
  - '@angular/cli@22.2.6'
  - '@schematics/angular@22.2.6'
shamefullyHoist: true
