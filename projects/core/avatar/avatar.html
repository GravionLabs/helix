<ng-content></ng-content>
@if (label()) {
  <span [hBind]="ptm('label')" [class]="cx('label')" [attr.data-h]="dataP">{{ label() }}</span>
} @else {
  @if (icon()) {
    <span [hBind]="ptm('icon')" [class]="icon()" [ngClass]="cx('icon')" [attr.data-h]="dataP"></span>
  } @else {
    @if (image()) {
      <img [hBind]="ptm('image')" [src]="image()" (error)="imageError($event)" [attr.aria-label]="ariaLabel()" [attr.data-h]="dataP" />
    }
  }
}
