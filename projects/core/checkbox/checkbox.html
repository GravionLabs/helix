<input
  #input
  [attr.id]="inputId()"
  type="checkbox"
  [attr.value]="value()"
  [attr.name]="name()"
  [checked]="checked"
  [attr.tabindex]="tabindex()"
  [attr.required]="required() ? '' : undefined"
  [attr.readonly]="readonly() ? '' : undefined"
  [attr.disabled]="$disabled() ? '' : undefined"
  [attr.aria-labelledby]="ariaLabelledBy()"
  [attr.aria-label]="ariaLabel()"
  [style]="inputStyle()"
  [class]="cn(cx('input'), inputClass())"
  [hBind]="ptm('input')"
  (focus)="onInputFocus($event)"
  (blur)="onInputBlur($event)"
  (change)="handleChange($event)"
  />
<div [class]="cx('box')" [hBind]="ptm('box')" [attr.data-h]="dataP">
  @if (!checkboxIconTemplate() && !_checkboxIconTemplate) {
    @if (checked) {
      @if (checkboxIcon()) {
        <span [class]="cx('icon')" [ngClass]="checkboxIcon()" [hBind]="ptm('icon')" [attr.data-h]="dataP"></span>
      }
      @if (!checkboxIcon()) {
        <svg data-h-icon="check" [class]="cx('icon')" [hBind]="ptm('icon')" [attr.data-h]="dataP" />
      }
    }
    @if (_indeterminate()) {
      <svg data-h-icon="minus" [class]="cx('icon')" [hBind]="ptm('icon')" [attr.data-h]="dataP" />
    }
  }
  <ng-template *ngTemplateOutlet="checkboxIconTemplate() || _checkboxIconTemplate; context: { checked: checked, class: cx('icon'), dataP: dataP }"></ng-template>
</div>
