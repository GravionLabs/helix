<div [hBind]="ptm('contentWrapper')" [class]="cx('contentWrapper')" [attr.data-h]="dataP">
  <div [hBind]="ptm('content')" [class]="cx('content')" [attr.data-h]="dataP">
    @if (iconTemplate() || _iconTemplate) {
      <ng-container *ngTemplateOutlet="iconTemplate() || _iconTemplate"></ng-container>
    }
    @if (icon()) {
      <i [hBind]="ptm('icon')" [class]="cn(cx('icon'), icon())" [attr.data-h]="dataP"></i>
    }

    @if (containerTemplate() || _containerTemplate) {
      <ng-container *ngTemplateOutlet="containerTemplate() || _containerTemplate; context: { closeCallback: closeCallback }"></ng-container>
    } @else {
      @if (!escape()) {
        <div>
          @if (!escape()) {
            <span [hBind]="ptm('text')" [ngClass]="cx('text')" [innerHTML]="text()" [attr.data-h]="dataP"></span>
          }
        </div>
      } @else {
        @if (escape() && text()) {
          <span [hBind]="ptm('text')" [ngClass]="cx('text')" [attr.data-h]="dataP">{{ text() }}</span>
        }
      }


      <span [hBind]="ptm('text')" [ngClass]="cx('text')" [attr.data-h]="dataP">
        <ng-content></ng-content>
      </span>
    }
    @if (closable()) {
      <button [hBind]="ptm('closeButton')" hRipple type="button" [class]="cx('closeButton')" (click)="close($event)" [attr.aria-label]="closeAriaLabel" [attr.data-h]="dataP">
        @if (closeIcon()) {
          <i [hBind]="ptm('closeIcon')" [class]="cn(cx('closeIcon'), closeIcon())" [ngClass]="closeIcon()" [attr.data-h]="dataP"></i>
        }
        @if (closeIconTemplate() || _closeIconTemplate) {
          <ng-container *ngTemplateOutlet="closeIconTemplate() || _closeIconTemplate"></ng-container>
        }
        @if (!closeIconTemplate() && !_closeIconTemplate && !closeIcon()) {
          <svg [hBind]="ptm('closeIcon')" data-h-icon()="times" [class]="cx('closeIcon')" [attr.data-h]="dataP" />
        }
      </button>
    }
  </div>
</div>
