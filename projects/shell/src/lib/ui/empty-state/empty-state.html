<div class="helix-empty-state__inner">
  @if (icon(); as icon) {
    <span class="helix-empty-state__icon" aria-hidden="true"><i [class]="icon"></i></span>
  }
  @switch (headingLevel()) {
    @case (2) { <h2 class="helix-empty-state__title">{{ title() }}</h2> }
    @case (4) { <h4 class="helix-empty-state__title">{{ title() }}</h4> }
    @case (5) { <h5 class="helix-empty-state__title">{{ title() }}</h5> }
    @case (6) { <h6 class="helix-empty-state__title">{{ title() }}</h6> }
    @default { <h3 class="helix-empty-state__title">{{ title() }}</h3> }
  }
  @if (description(); as description) {
    <p class="helix-empty-state__description">{{ description }}</p>
  }
  <div class="helix-empty-state__actions"><ng-content /></div>
</div>
