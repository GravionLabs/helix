<hx-card class="helix-stat-card__card" [ariaLabel]="label()">
  <div class="helix-stat-card__top">
    <div class="helix-stat-card__text">
      <span class="helix-stat-card__label">{{ label() }}</span>
      <span class="helix-stat-card__value">{{ formattedValue() }}</span>
    </div>
    @if (icon(); as icon) {
      <span class="helix-stat-card__icon" aria-hidden="true"><i [class]="icon"></i></span>
    }
  </div>
  @if (direction(); as direction) {
    <p class="helix-stat-card__trend" [class]="'helix-stat-card__trend helix-stat-card__trend--' + direction">
      <i
        class="helix-stat-card__arrow"
        [class.pi]="true"
        [class.pi-arrow-up]="direction === 'up'"
        [class.pi-arrow-down]="direction === 'down'"
        [class.pi-minus]="direction === 'flat'"
        aria-hidden="true"
      ></i>
      <span class="helix-stat-card__sr">{{ direction }}</span>
      <span class="helix-stat-card__trend-value">{{ trendText() }}</span>
      @if (trendLabel(); as trendLabel) {
        <span class="helix-stat-card__trend-label">{{ trendLabel }}</span>
      }
    </p>
  }
  <ng-content />
</hx-card>
