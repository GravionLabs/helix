<div class="layout-topbar">
  <div class="layout-topbar-start">
    <button
      type="button"
      class="layout-menu-button layout-topbar-action"
      [class.layout-menu-button-mobile-only]="store.isStatic()"
      aria-label="Toggle navigation"
      (click)="store.onMenuToggle()"
    >
      <i class="pi pi-bars"></i>
    </button>
    @if (showBreadcrumbs()) {
      <hx-breadcrumb [model]="effectiveBreadcrumbs()" [home]="{ icon: 'pi pi-home', routerLink: '/' }" />
    } @else {
      <span class="layout-topbar-title">{{ effectiveTitle() }}</span>
    }
  </div>

  <div class="layout-topbar-end">
    <div class="layout-topbar-slot">
      <ng-content select="[helixTopbarEnd]" />
    </div>
  </div>
</div>
