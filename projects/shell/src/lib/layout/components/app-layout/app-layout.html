<div class="layout-wrapper" [ngClass]="containerClass()">
  <helix-nav-rail
    [model]="effectiveNavGroups()"
    [appTitle]="appTitle()"
    [brandIcon]="brandIcon()"
    [items]="effectiveItems()"
    [menuActions]="effectiveTopbarActions()"
  ></helix-nav-rail>
  <div class="layout-main-container">
    <div class="layout-panel">
      <helix-topbar [pageTitle]="pageTitle()" [appTitle]="appTitle()">
        <ng-content select="[helixTopbarEnd]" ngProjectAs="[helixTopbarEnd]" />
      </helix-topbar>
      <div
        #mainPanel
        class="layout-main"
        [attr.inert]="store.mobileMenuActive() ? '' : null"
      >
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
  <helix-status-bar
    [brand]="statusBarBrand()"
    [environment]="statusBarEnvironment()"
    [note]="statusBarNote()"
    [tone]="statusBarTone()"
    [versions]="statusBarVersions()"
  >
    <ng-content select="[hxStatusBarEnd]" ngProjectAs="[hxStatusBarEnd]" />
  </helix-status-bar>
  <div class="layout-mask"></div>
</div>
