<div class="flex gap-4 top-8 right-8" [ngClass]="{ fixed: float() }">
  <button
    hx-button
    type="button"
    iconOnly
    rounded
    severity="secondary"
    [attr.aria-label]="darkModeLabel()"
    (click)="toggleDarkMode()"
  >
    <span [class]="isDarkTheme() ? 'pi pi-moon' : 'pi pi-sun'" aria-hidden="true"></span>
  </button>
  <div class="relative">
    <button
      hx-button
      type="button"
      iconOnly
      rounded
      [attr.aria-label]="configuratorLabel()"
      helixDisclosure
      helixDisclosureAnimate
    >
      <span class="pi pi-palette" aria-hidden="true"></span>
    </button>
    <helix-configurator />
  </div>
</div>
