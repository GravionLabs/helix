<helix-form-field [label]="label()" [hint]="hint()" [error]="firstError()">
  <hx-select
    fluid
    [options]="selectOptions()"
    [placeholder]="placeholder()"
    [ariaLabel]="label()"
    [value]="state().value()"
    [disabled]="state().disabled()"
    [invalid]="showInvalid()"
    (valueChange)="state().value.set($event)"
    (touch)="state().markAsTouched()"
  />
</helix-form-field>
