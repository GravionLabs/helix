<svg
  class="hx-progress-spinner-svg"
  viewBox="25 25 50 50"
  aria-hidden="true"
  [style.animation-duration]="animationDuration()"
>
  <circle
    class="hx-progress-spinner-circle"
    cx="50"
    cy="50"
    r="20"
    fill="none"
    [attr.stroke-width]="strokeWidth()"
    stroke-miterlimit="10"
    [style.animation-duration]="animationDuration()"
  />
</svg>
