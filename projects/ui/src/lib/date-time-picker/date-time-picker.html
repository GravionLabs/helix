@if (inline()) {
  <ng-container [ngTemplateOutlet]="panel" />
} @else {
  <div class="hx-date-time-picker-field" cdkOverlayOrigin #origin="cdkOverlayOrigin">
    <input
      #field
      type="text"
      class="hx-date-time-picker-input"
      autocomplete="off"
      aria-haspopup="dialog"
      [attr.id]="inputId() ?? null"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [value]="text()"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="open() ? popupId : null"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-labelledby]="ariaLabelledby() ?? null"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      (input)="onTyping($event)"
      (change)="commitTyping()"
      (click)="show()"
      (keydown)="onFieldKeydown($event)"
    />
    @if (showIcon()) {
      <button
        type="button"
        class="hx-date-time-picker-trigger"
        aria-haspopup="dialog"
        [attr.aria-label]="chooseLabel()"
        [attr.aria-expanded]="open()"
        [disabled]="isDisabled()"
        (click)="toggle()"
      >
        <span class="hx-date-time-picker-trigger-icon" aria-hidden="true"></span>
      </button>
    }
  </div>
  <ng-template
    cdkConnectedOverlay
    cdkConnectedOverlayPanelClass="hx-date-time-picker-overlay"
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="open()"
    [cdkConnectedOverlayPositions]="positions"
    (overlayOutsideClick)="onOutsideClick($event)"
    (overlayKeydown)="onOverlayKeydown($event)"
    (attach)="onAttach()"
    (detach)="open.set(false)"
  >
    <div
      class="hx-date-time-picker-popup"
      role="dialog"
      aria-modal="false"
      [id]="popupId"
      [attr.aria-label]="ariaLabel() ?? chooseLabel()"
      [attr.aria-labelledby]="ariaLabelledby() ?? null"
      (focusout)="onPopupFocusOut($event)"
    >
      <ng-container [ngTemplateOutlet]="panel" />
      @if (showButtonBar()) {
        <div class="hx-date-time-picker-buttonbar">
          <button type="button" class="hx-date-time-picker-button" (click)="selectToday()">{{ todayLabel() }}</button>
          <button type="button" class="hx-date-time-picker-button" (click)="clear()">{{ clearLabel() }}</button>
        </div>
      }
    </div>
  </ng-template>
}

<ng-template #panel>
  <div
    class="hx-date-time-picker-panel"
    role="group"
    [attr.aria-label]="inline() ? (ariaLabel() ?? chooseLabel()) : null"
    [attr.aria-labelledby]="inline() ? (ariaLabelledby() ?? null) : null"
    (focusout)="onInlineFocusOut($event)"
  >
    <hx-calendar
      [(focusedDate)]="focusedDate"
      [(view)]="view"
      [selectedDates]="selectedDates()"
      selectionMode="single"
      [minDate]="minDate()"
      [maxDate]="maxDate()"
      [disabledDates]="disabledDates()"
      [firstDayOfWeek]="firstDayOfWeek()"
      [locale]="locale()"
      [disabled]="isDisabled()"
      [titleId]="titleId"
      [today]="today"
      (picked)="pick($event)"
    />
    <hx-time-row
      [time]="time()"
      [hour12]="hour12()"
      [showMinutes]="showMinutes()"
      [showSeconds]="showSeconds()"
      [stepHour]="stepHour()"
      [stepMinute]="stepMinute()"
      [stepSecond]="stepSecond()"
      [locale]="locale()"
      [disabled]="isDisabled()"
      [timeLabel]="timeLabel()"
      [hourLabel]="hourLabel()"
      [minuteLabel]="minuteLabel()"
      [secondLabel]="secondLabel()"
      [periodLabel]="periodLabel()"
      (timeChange)="setTime($event)"
    />
  </div>
</ng-template>
