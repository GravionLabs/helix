<ng-template #panel>
  <hx-dialog-frame
    class="hx-drawer"
    [header]="header()"
    [titleId]="titleId"
    [closable]="closable()"
    [closeLabel]="closeLabel()"
    (closeClick)="visible.set(false)"
  >
    <ng-container ngProjectAs="[hxDialogHeader]"
      ><ng-content select="[hxDialogHeader]"
    /></ng-container>
    <ng-content />
    <ng-container ngProjectAs="[hxDialogFooter]"
      ><ng-content select="[hxDialogFooter]"
    /></ng-container>
  </hx-dialog-frame>
</ng-template>
