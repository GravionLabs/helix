<div class="hx-date-time-range-picker-fields" role="group" [attr.aria-label]="ariaLabel() ?? null" [attr.aria-labelledby]="ariaLabelledby() ?? null">
  <hx-date-picker
    class="hx-date-time-range-picker-from"
    [inputId]="inputId()"
    [ariaLabel]="fromLabel()"
    [placeholder]="fromLabel()"
    [value]="value().from"
    [minDate]="minDate()"
    [maxDate]="fromMax()"
    [showTime]="showTime()"
    [timeOnly]="timeOnly()"
    [hourFormat]="hourFormat()"
    [showMinutes]="showMinutes()"
    [showSeconds]="showSeconds()"
    [stepHour]="stepHour()"
    [stepMinute]="stepMinute()"
    [stepSecond]="stepSecond()"
    [dateFormat]="dateFormat()"
    [locale]="locale()"
    [firstDayOfWeek]="firstDayOfWeek()"
    [disabledDates]="disabledDates()"
    [showIcon]="showIcon()"
    [showButtonBar]="showButtonBar()"
    [disabled]="isDisabled()"
    [invalid]="invalid()"
    (valueChange)="setFrom($event)"
    (touch)="markTouched()"
  />
  <span class="hx-date-time-range-picker-separator" aria-hidden="true">{{ separator() }}</span>
  <hx-date-picker
    class="hx-date-time-range-picker-to"
    [ariaLabel]="toLabel()"
    [placeholder]="toLabel()"
    [value]="value().to"
    [minDate]="toMin()"
    [maxDate]="maxDate()"
    [showTime]="showTime()"
    [timeOnly]="timeOnly()"
    [hourFormat]="hourFormat()"
    [showMinutes]="showMinutes()"
    [showSeconds]="showSeconds()"
    [stepHour]="stepHour()"
    [stepMinute]="stepMinute()"
    [stepSecond]="stepSecond()"
    [dateFormat]="dateFormat()"
    [locale]="locale()"
    [firstDayOfWeek]="firstDayOfWeek()"
    [disabledDates]="disabledDates()"
    [showIcon]="showIcon()"
    [showButtonBar]="showButtonBar()"
    [disabled]="isDisabled()"
    [invalid]="invalid()"
    (valueChange)="setTo($event)"
    (touch)="markTouched()"
  />
</div>
