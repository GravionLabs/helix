<ng-template #panel>
  @if (current(); as c) {
    <hx-dialog-frame [header]="c.header" [titleId]="titleId" [closable]="false">
      <div class="hx-confirm-content">
        @if (c.icon) {
          <span class="hx-confirm-icon" [class]="c.icon" aria-hidden="true"></span>
        }
        <p class="hx-confirm-message" [id]="messageId">{{ c.message }}</p>
      </div>
      @if (c.content) {
        <div class="hx-confirm-extra">
          <ng-container [ngTemplateOutlet]="c.content" />
        </div>
      }
      <ng-container ngProjectAs="[hxDialogFooter]">
        <button
          hx-button
          type="button"
          variant="text"
          severity="secondary"
          class="hx-confirm-reject"
          (click)="answer(false)"
        >
          {{ c.rejectLabel ?? 'No' }}
        </button>
        <button
          hx-button
          type="button"
          class="hx-confirm-accept"
          [severity]="c.acceptSeverity ?? 'primary'"
          (click)="answer(true)"
        >
          {{ c.acceptLabel ?? 'Yes' }}
        </button>
      </ng-container>
    </hx-dialog-frame>
  }
</ng-template>
