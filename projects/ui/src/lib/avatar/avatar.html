@if (image()) {
  <img class="hx-avatar-image" [src]="image()" alt="" />
} @else if (icon()) {
  <span class="hx-avatar-icon" [class]="icon()" aria-hidden="true"></span>
} @else if (label()) {
  <span
    class="hx-avatar-label"
    [attr.aria-hidden]="ariaLabel() ? 'true' : null"
    >{{ label() }}</span
  >
} @else {
  <ng-content />
}
