<ng-content select="[slot=toolbar]" />
<div class="hx-app-shell-body">
  <ng-content select="[slot=activity]" />
  <div
    class="hx-app-shell-sidebar"
    [hidden]="collapsed()"
    [style.width.px]="width()"
  >
    <ng-content select="[slot=sidebar]" />
  </div>
  @if (!collapsed()) {
    <div
      class="hx-app-shell-resizer"
      role="separator"
      aria-orientation="vertical"
      tabindex="0"
      [attr.aria-label]="resizerLabel()"
      [attr.aria-valuenow]="width()"
      [attr.aria-valuemin]="minWidth()"
      [attr.aria-valuemax]="maxWidth()"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerEnd($event)"
      (pointercancel)="onPointerEnd($event)"
      (keydown)="onKeydown($event)"
    ></div>
  }
  <div class="hx-app-shell-main">
    <main class="hx-app-shell-content"><ng-content /></main>
    @if (bottomOpen()) {
      <div
        class="hx-app-shell-resizer hx-app-shell-resizer-bottom"
        role="separator"
        aria-orientation="horizontal"
        tabindex="0"
        [attr.aria-label]="bottomResizerLabel()"
        [attr.aria-valuenow]="height()"
        [attr.aria-valuemin]="minBottomHeight()"
        [attr.aria-valuemax]="maxBottomHeight()"
        (pointerdown)="onBottomPointerDown($event)"
        (pointermove)="onBottomPointerMove($event)"
        (pointerup)="onBottomPointerEnd($event)"
        (pointercancel)="onBottomPointerEnd($event)"
        (keydown)="onBottomKeydown($event)"
      ></div>
    }
    <div class="hx-app-shell-bottom" [hidden]="!bottomOpen()" [style.height.px]="height()">
      <ng-content select="[slot=bottom]" />
    </div>
  </div>
  <ng-content select="[slot=panel]" />
</div>
<ng-content select="[slot=status]" />
