name: CI / Publish

permissions:
  contents: write
  checks: write
  pull-requests: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      force-publish:
        description: 'Publish regardless of the current branch'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      npm-version: ${{ steps.version.outputs.npm-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@511932d4b5d0d7c77149bb705cfc2b6bae5f2df1 # v1.15.0

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: CI
        uses: GravionLabs/ci/node/ci@511932d4b5d0d7c77149bb705cfc2b6bae5f2df1 # v1.15.0
        with:
          node-version: '26' # GravionLabs/ci node/ci has no node-version-file input
          package-manager: pnpm
          lint-command: pnpm run format:check && pnpm run lint
          build-command: pnpm run build
          run-tests: true
          test-command: pnpm run test:ci
          coverage-format: cobertura

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-build
          path: dist
          if-no-files-found: warn

  publish:
    name: Publish
    needs: [determine-version, build-test]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.force-publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-build
          path: .

      # Publishes to the public npm registry (registry.npmjs.org) via npm's
      # OIDC "trusted publisher" flow (npm CLI >= 11.5, this job's
      # id-token: write permission) — no NPM_TOKEN secret needed, and no auth
      # token is configured below on purpose. This requires a one-time setup
      # on npmjs.com per package — for each of @gravionlabs/helix-ui,
      # helix-shell, helix-zod, helix-ag-grid, helix-desktop: Settings → Trusted Publisher →
      # GitHub Actions → owner GravionLabs, repo helix, workflow ci.yml. Until
      # that's configured for a given package, its publish step below 404s /
      # 401s with no trusted publisher found — configuring it is a manual,
      # per-account step only an npm org owner can do.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org/'

      - name: Set package versions
        run: |
          set -euo pipefail
          for dir in ui shell zod ag-grid desktop; do
            npm --prefix "./$dir" version "${{ needs.determine-version.outputs.npm-version }}" --no-git-tag-version --allow-same-version
          done

      - name: Publish packages
        run: |
          set -euo pipefail
          for dir in ui shell zod ag-grid desktop; do
            # The leading ./ keeps npm from reading the name as a "user/repo" git shorthand.
            npm publish "./$dir" --access public --provenance
          done

  release:
    name: Release
    needs: [determine-version, publish]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.force-publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@511932d4b5d0d7c77149bb705cfc2b6bae5f2df1 # v1.15.0
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          tag-prefix: v
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          # Merging the release PR deletes release/next (delete_branch_on_merge); recreated here at the released commit.
          recreate-branch: release/next
