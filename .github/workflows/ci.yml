name: CI / Publish

permissions:
  contents: write
  checks: write
  pull-requests: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      force-publish:
        description: 'Publish regardless of the current branch'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      npm-version: ${{ steps.version.outputs.npm-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: CI
        uses: GravionLabs/ci/node/ci@main
        with:
          node-version: '24'
          package-manager: pnpm
          lint-command: pnpm run lint
          build-command: pnpm run build
          run-tests: true
          test-command: pnpm run test:ci
          coverage-format: cobertura

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: dist
          if-no-files-found: warn

  publish:
    name: Publish
    needs: [determine-version, build-test]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.force-publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-build
          path: .

      # Publishes to the public npm registry (registry.npmjs.org) via npm's
      # OIDC "trusted publisher" flow (npm CLI >= 11.5, this job's
      # id-token: write permission) — no NPM_TOKEN secret needed, and no auth
      # token is configured below on purpose. This requires a one-time setup
      # on npmjs.com per package — for each of @gravionlabs/helix-core,
      # helix-shell, helix-zod, helix-ag-grid: Settings → Trusted Publisher →
      # GitHub Actions → owner GravionLabs, repo helix, workflow ci.yml. Until
      # that's configured for a given package, its publish step below 404s /
      # 401s with no trusted publisher found — configuring it is a manual,
      # per-account step only an npm org owner can do.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Set package versions
        run: |
          set -euo pipefail
          for dir in core shell zod ag-grid; do
            npm --prefix "./$dir" version "${{ needs.determine-version.outputs.npm-version }}" --no-git-tag-version --allow-same-version
          done

      - name: Publish packages
        run: |
          set -euo pipefail
          for dir in core shell zod ag-grid; do
            # The leading ./ matters: a bare "core" is ambiguous with npm's
            # "user/repo" git-shorthand package spec and gets misparsed as one.
            npm publish "./$dir" --access public --provenance
          done

  release:
    name: Release
    needs: [determine-version, publish]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.force-publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          tag-prefix: v
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
