name: Pages

# One public site on GitHub Pages:
#   /        the documentation site: docs/ as a website (apps/site, VitePress)
#   /demo/   the Angular demo (apps/helix-demo, built with --base-href /<repository>/demo/)
# Pull requests that touch the site, the documents or this workflow build all of it, so a broken link or a
# broken demo is found before the merge; only main deploys, and only while the repository variable
# DEPLOY_PAGES is "true" (Settings → Pages → Source must be "GitHub Actions").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deployments queue up behind each other and the last one wins; a pull request replaces its own earlier run.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    if: github.event_name == 'pull_request' || vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    env:
      # Every piece knows where it lives: https://<owner>.github.io/<repository>/…
      PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      # The demo needs the built libraries. The site's design tokens (`build:site` → `tokens:site`) are resolved
      # from projects/tokens and need nothing built.
      - name: Build the libraries
        run: pnpm build:lib
      # Dead links in the documents fail this step.
      - name: Build the documentation site
        run: SITE_BASE="$PAGES_BASE" pnpm build:site
      - name: Build the demo
        run: pnpm build:demo:pages
      - name: Put the pieces together
        run: pnpm pages:assemble
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/pages

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
