name: Renovate config

# A typo in the Renovate configuration stops the dependency updates without a sound: check it.
on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - '.github/renovate.json5'
      - '.github/workflows/renovate-config.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate the configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # No install of the repository: the validator is a one-off tool.
      # strictDepBuilds=false: the pnpm of this repository (12.3.4) otherwise ends with ERR_PNPM_IGNORED_BUILDS; the build
      # scripts of the validator's dependencies stay unrun (re2 falls back to RegExp with a warning).
      - run: pnpm --config.strictDepBuilds=false dlx --package renovate@44.224.2 renovate-config-validator --strict .github/renovate.json5
