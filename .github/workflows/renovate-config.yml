name: Renovate config

# A typo in the Renovate configuration stops the dependency updates without a sound: check it.
on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - '.github/renovate.json5'
      - '.github/workflows/renovate-config.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate the configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # No install of the repository: the validator is a one-off tool. npx, not `pnpm dlx`: the pnpm of this repository
      # (12.3.4) ends a dlx with ERR_PNPM_IGNORED_BUILDS because of the build scripts of the validator's dependencies.
      - run: npx --yes --package=renovate@44.224.2 -- renovate-config-validator --strict .github/renovate.json5
