name: Feature
description: A user-facing or system capability, part of an Epic.
title: '[Feature] '
labels: ['feature']
body:
  - type: input
    id: epic
    attributes:
      label: Parent Epic
      description: '#<issue number>'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: subissues
    attributes:
      label: Sub-issues
      description: >-
        List PBI children as they are created, one per line (e.g. "- #12 PBI title"). Keep this in
        sync by hand — it's for readability; the native panel below is the source of truth for
        progress.
  - type: markdown
    attributes:
      value: |
        Add PBI children via GitHub's native **sub-issues** panel on this issue (not a manual checklist) — it keeps progress and completion % in sync automatically. Also list them in the Sub-issues field above so they're readable inline.
        Set this issue's **Parent** to the Epic above using the same panel, so the hierarchy is linked both ways.
