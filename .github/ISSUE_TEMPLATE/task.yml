name: Task
description: A concrete, implementable unit of work under a PBI (or a Bug).
title: '[Task] '
labels: ['task']
body:
  - type: input
    id: parent
    attributes:
      label: Parent PBI or Bug
      description: '#<issue number>'
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Implementation notes
  - type: textarea
    id: files
    attributes:
      label: Files
      description: The files this task creates or changes, one per line.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: >-
        Checkboxes an agent can tick without asking, ending with the parent PBI's verification
        commands.
      value: |
        - [ ] ...
        - [ ] Verification from the parent PBI passes
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Set this issue's **Parent** to the PBI or Bug above via GitHub's native sub-issues panel, so the hierarchy is linked both ways.
