<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Helix Demo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://primefaces.org" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://primefaces.org/cdn/primeng/images/favicon.png"
    />
    <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
    <script>
      // GitHub Pages serves the root 404.html for a deep link such as /helix/demo/uikit/table; that page
      // stores the address and sends the browser here. Restore it before the router starts.
      (function () {
        try {
          var target = sessionStorage.getItem('helix-demo-redirect');
          if (target) {
            sessionStorage.removeItem('helix-demo-redirect');
            history.replaceState(null, '', target);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
