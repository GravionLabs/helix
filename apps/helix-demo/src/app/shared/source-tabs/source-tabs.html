<hx-tabs [value]="activeTab()" (valueChange)="activeTab.set($event ?? 'demo')" scrollable>
  <hx-tab-list>
    <hx-tab value="demo">Demo</hx-tab>
    @for (tab of tabs(); track tab.file) {
      <hx-tab [value]="tab.file">{{ tab.label }}</hx-tab>
    }
    <hx-tab value="docs">Docs</hx-tab>
  </hx-tab-list>
  <hx-tab-panels>
    <hx-tab-panel value="demo">
      <ng-content />
    </hx-tab-panel>
    @for (tab of tabs(); track tab.file) {
      <hx-tab-panel value="{{ tab.file }}">
        <pre class="source-tabs__code"><code [highlight]="source(tab.file)" [language]="tab.language"></code></pre>
      </hx-tab-panel>
    }
    <hx-tab-panel value="docs">
      <p class="text-sm text-muted-color">Documentation coming soon.</p>
    </hx-tab-panel>
  </hx-tab-panels>
</hx-tabs>
