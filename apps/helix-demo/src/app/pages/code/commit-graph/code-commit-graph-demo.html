<h1 class="sr-only">Commit graph</h1>
<app-source-tabs
  library="helix-code"
  directory="code/commit-graph"
  componentName="code-commit-graph-demo"
>
  <div class="card flex flex-col gap-3">
    <h2 class="demo-title">Commit graph</h2>
    <p class="m-0">
      <code>hx-commit-graph</code> draws the history with lanes, ref labels, message, author and
      time. Use the arrow keys, Home and End, or click.
    </p>
    <p class="m-0" aria-live="polite">Selected: {{ selected() ?? 'none' }}</p>
    <hx-commit-graph
      aria-label="History"
      [commits]="commits"
      [selected]="selected()"
      (selectedChange)="selected.set($event)"
    >
      <ng-template hxCommitGraphRowCell let-commit>
        <button
          type="button"
          class="p-button p-button-text p-button-sm"
          (click)="copied.set(commit.id)"
        >
          Copy id
        </button>
      </ng-template>
    </hx-commit-graph>
    <p class="m-0" aria-live="polite">Copied: {{ copied() ?? 'nothing' }}</p>
  </div>
</app-source-tabs>
