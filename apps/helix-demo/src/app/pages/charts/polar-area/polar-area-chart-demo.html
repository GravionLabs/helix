<h1 class="sr-only">Polar area chart</h1>
<app-source-tabs library="helix-ui" directory="charts/polar-area" componentName="polar-area-chart-demo">
  <div class="grid grid-cols-12 gap-layout">
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h2 class="demo-title mb-3!">Polar Area</h2>
        <hx-chart type="polarArea" [data]="polarData" [options]="polarOptions" height="20rem" ariaLabel="Four values, as a polar area" />
      </div>
    </div>
  </div>
</app-source-tabs>
