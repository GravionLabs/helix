<div class="card">
  <h2 class="demo-title mb-2!">Recent Sales</h2>
  <div class="hx-table-scroll">
    <table hx-table hoverable>
      <thead>
        <tr>
          <th scope="col">Image</th>
          <th scope="col">Name</th>
          <th scope="col">Price</th>
          <th scope="col">View</th>
        </tr>
      </thead>
      <tbody>
        @for (product of recent(); track product.id) {
          <tr>
            <td style="width: 15%; min-width: 5rem;">
              <img
                src="https://primefaces.org/cdn/primevue/images/product/{{ product.image }}"
                class="shadow-lg"
                alt=""
                width="50"
              />
            </td>
            <th scope="row" style="width: 35%; min-width: 7rem;">{{ product.name }}</th>
            <td style="width: 35%; min-width: 8rem;">{{ product.price | currency: 'USD' }}</td>
            <td style="width: 15%;">
              <button hx-button type="button" iconOnly variant="text" [attr.aria-label]="'View ' + product.name">
                <span class="pi pi-search hx-button-icon" aria-hidden="true"></span>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
