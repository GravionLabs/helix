<h1 class="sr-only">Chart</h1>
<app-source-tabs directory="charts" componentName="chart-demo">
  <div class="grid grid-cols-12 gap-layout">
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h2 class="demo-title mb-3!">Linear</h2>
        <hx-chart type="line" [data]="lineData" height="20rem" ariaLabel="Two datasets over seven months, as lines" />
      </div>
    </div>
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h2 class="demo-title mb-3!">Bar</h2>
        <hx-chart type="bar" [data]="barData" [options]="barOptions" height="20rem" ariaLabel="Two datasets over seven months, as bars" />
      </div>
    </div>
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h2 class="demo-title mb-3!">Pie</h2>
        <hx-chart type="pie" [data]="pieData" [options]="pieOptions" height="20rem" ariaLabel="Three shares, as a pie" />
      </div>
    </div>
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h2 class="demo-title mb-3!">Doughnut</h2>
        <hx-chart type="doughnut" [data]="pieData" [options]="pieOptions" height="20rem" ariaLabel="Three shares, as a doughnut" />
      </div>
    </div>
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h2 class="demo-title mb-3!">Polar Area</h2>
        <hx-chart type="polarArea" [data]="polarData" [options]="polarOptions" height="20rem" ariaLabel="Four values, as a polar area" />
      </div>
    </div>
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h2 class="demo-title mb-3!">Radar</h2>
        <hx-chart type="radar" [data]="radarData" height="20rem" ariaLabel="Two datasets over seven skills, as a radar" />
      </div>
    </div>
  </div>
</app-source-tabs>
