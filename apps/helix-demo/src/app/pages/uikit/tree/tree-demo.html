<h1 class="sr-only">Tree</h1>
<app-source-tabs directory="tree" componentName="tree-demo" [docs]="['data-table', 'tree']">
  <div class="card">
    <h2 class="demo-title">Tree</h2>
    <p class="mb-3">Checking a folder checks everything below it; a folder with some children checked is mixed. Arrow keys move, Right and Left open and close, typing jumps by label.</p>
    <hx-tree ariaLabel="Files" [value]="treeValue()" selectionMode="checkbox" filter [(selection)]="selected" />
    <p class="mt-3 mb-0">Checked: {{ selected() }}</p>
  </div>
  <app-data-section class="mt-6 block" />
</app-source-tabs>
